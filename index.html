<style>
  /* Layout: stone-light surface, bold indigenous green accent, three plan cards above a quiet horizon of carved rock. */
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --surface-sunk:#EBE8DF;
    --fg:#1E2420;
    --fg-muted:#5A6058;
    --line:#D7D3C6;
    --accent:#2F8A3B;
    --accent-strong:#1F6B2A;
    --accent-soft:#79ED91;
    --accent-mint:#E7F8E9;
    --slate:#698696;
    --olive:#71776D;
    --warm:#C9B36B;
    --familiar:#C14D4D;
    --deportivo:#2E6FA6;
    --estudiantil:#8A6D2F;
    --shadow: 0 1px 2px rgba(30,36,32,.05), 0 8px 24px -12px rgba(30,36,32,.18);
    --radius-lg:18px;
    --radius-md:12px;
    --font-display:"Fraunces", "Iowan Old Style", Georgia, serif;
    --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181A;
      --surface:#1E2225;
      --surface-sunk:#161A1C;
      --fg:#ECECE4;
      --fg-muted:#9FA69B;
      --line:#2E3338;
      --accent:#79ED91;
      --accent-strong:#4DBE55;
      --accent-soft:#2E6B37;
      --accent-mint:#1C2920;
      --slate:#8CA3B2;
      --olive:#9AA193;
      --warm:#D9C27E;
      --familiar:#E88080;
      --deportivo:#79B2E0;
      --estudiantil:#D4B875;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181A;
    --surface:#1E2225;
    --surface-sunk:#161A1C;
    --fg:#ECECE4;
    --fg-muted:#9FA69B;
    --line:#2E3338;
    --accent:#79ED91;
    --accent-strong:#4DBE55;
    --accent-soft:#2E6B37;
    --accent-mint:#1C2920;
    --slate:#8CA3B2;
    --olive:#9AA193;
    --warm:#D9C27E;
    --familiar:#E88080;
    --deportivo:#79B2E0;
    --estudiantil:#D4B875;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *,*::before,*::after{ box-sizing:border-box }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100%;
  }

  /* --- Top navigation bar --- */
  .topbar{
    position:sticky;
    top: env(safe-area-inset-top, 0px);
    z-index:40;
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.3) blur(10px);
    -webkit-backdrop-filter: saturate(1.3) blur(10px);
    border-bottom:1px solid var(--line);
  }
  body::before{
    content:"";
    position:fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index:50;
    background: var(--bg);
  }
  .topbar-inner{
    display:grid;
    grid-template-columns: auto 1fr auto;
    align-items:center;
    gap:16px;
    padding-block:14px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    max-width:1180px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--fg);
    text-decoration:none;
  }
  .brand-logo{
    width:68px;
    height:68px;
    border-radius:50%;
    display:grid;
    place-items:center;
    flex-shrink:0;
    filter: drop-shadow(0 2px 6px rgba(30,36,32,.18));
  }
  .brand-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  @media (max-width:600px){
    .brand-logo{ width:56px; height:56px; }
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  .brand-text .site{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.015em;
    line-height:1;
  }
  .topnav{
    display:flex;
    justify-content:center;
    gap:28px;
  }
  .topnav a{
    color:var(--fg-muted);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    letter-spacing:.01em;
    padding:6px 0;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .topnav a:hover,.topnav a.active{ color:var(--fg); border-bottom-color:var(--accent); }
  .cart-btn{
    position:relative;
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--fg);
    width:44px;
    height:44px;
    border-radius:50%;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .cart-btn:hover{ border-color:var(--accent); }
  .cart-btn:active{ transform:scale(.96); }
  .cart-btn svg{ width:20px; height:20px; }
  .cart-count{
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:10px;
    background:var(--accent-strong);
    color:#fff;
    font-size:11px;
    font-weight:700;
    display:grid;
    place-items:center;
    border:2px solid var(--bg);
    font-variant-numeric: tabular-nums;
  }
  .cart-count[hidden]{ display:none !important; }

  @media (max-width:720px){
    .topbar-inner{ grid-template-columns: 1fr auto; row-gap:8px; }
    .topnav{ grid-column: 1 / -1; grid-row: 2; justify-content:space-between; gap:12px; }
  }

  /* --- Hero --- */
  .hero{
    text-align:center;
    padding-block: 56px 36px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    max-width:900px;
    margin:0 auto;
  }
  .eyebrow{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent-strong);
    margin-bottom:14px;
    padding:4px 10px;
    border:1px solid var(--accent-strong);
    border-radius:999px;
  }
  h1.title{
    font-family:var(--font-display);
    font-weight:500;
    font-size: clamp(40px, 6vw, 68px);
    line-height:1.02;
    letter-spacing:-0.025em;
    margin:0 0 18px;
    text-wrap: balance;
    font-variation-settings: "opsz" 120, "SOFT" 60;
  }
  h1.title em{
    font-style:italic;
    font-weight:400;
    color:var(--accent-strong);
    font-variation-settings: "opsz" 144, "SOFT" 100;
  }
  .lede{
    font-size:16px;
    color:var(--fg-muted);
    max-width:60ch;
    margin:0 auto;
    text-wrap:pretty;
  }
  .hero-meta{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:28px;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--fg-muted);
  }
  .hero-meta div{ display:flex; align-items:center; gap:6px; }
  .hero-meta svg{ width:14px; height:14px; color:var(--accent); }

  /* --- Section intro --- */
  .section-intro{
    max-width:1180px;
    margin:0 auto;
    padding-block: 32px 20px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .section-intro h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:28px;
    letter-spacing:-0.015em;
    margin:0;
  }
  .section-intro p{
    font-size:13px;
    color:var(--fg-muted);
    margin:0;
  }

  /* --- Plan cards grid --- */
  .plans{
    max-width:1180px;
    margin:0 auto 72px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:22px;
  }
  @media (max-width:900px){
    .plans{ grid-template-columns: 1fr; }
  }

  .plan{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:0;
    text-align:left;
    cursor:pointer;
    overflow:hidden;
    font: inherit;
    color: inherit;
    transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .plan:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: color-mix(in oklab, var(--plan-color, var(--accent)) 50%, var(--line));
  }
  .plan:focus-visible{
    outline: 2px solid var(--plan-color, var(--accent));
    outline-offset: 3px;
  }
  .plan-art{
    position:relative;
    aspect-ratio: 4/3;
    overflow:hidden;
    border-bottom:1px solid var(--line);
    display:grid;
    place-items:center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 40%, color-mix(in oklab, var(--plan-color, var(--accent)) 10%, var(--surface-sunk)) 0%, var(--surface-sunk) 80%);
  }
  .plan-art img{
    max-width: 72%;
    max-height: 82%;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 6px 14px rgba(30,36,32,.15));
    transition: transform .25s cubic-bezier(.2,.7,.3,1);
  }
  .plan:hover .plan-art img{ transform: translateY(-3px) scale(1.03); }
  .plan-art svg{ width:100%; height:100%; display:block; }
  .plan-badge{
    position:absolute;
    top:14px;
    left:14px;
    background: var(--surface);
    color: var(--plan-color);
    padding: 5px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    border:1px solid var(--line);
  }
  .plan-body{
    padding: 22px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .plan-title{
    font-family:var(--font-display);
    font-weight:500;
    font-size:26px;
    letter-spacing:-0.015em;
    margin:0;
    line-height:1.1;
  }
  .plan-tag{
    font-size:13px;
    color:var(--fg-muted);
    margin:0;
  }
  .plan-foot{
    margin-top:auto;
    padding-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .plan-price{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    font-variant-numeric: tabular-nums;
  }
  .plan-price small{
    font-family:var(--font-body);
    font-weight:500;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--fg-muted);
    display:block;
    margin-bottom:1px;
  }
  .plan-cta{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    font-weight:600;
    color: var(--plan-color);
  }
  .plan-cta svg{ width:14px; height:14px; transition: transform .15s; }
  .plan:hover .plan-cta svg{ transform: translateX(3px); }

  /* --- Footer strip --- */
  .horizon{
    border-top:1px solid var(--line);
    padding-block: 28px 48px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    max-width:1180px;
    margin: 0 auto;
    display:grid;
    grid-template-columns: 1fr auto;
    gap:16px;
    align-items:center;
    font-size:12px;
    color:var(--fg-muted);
  }
  .horizon strong{ color:var(--fg); font-weight:600; }
  @media (max-width:600px){
    .horizon{ grid-template-columns:1fr; }
  }

  /* --- Modal (shared) --- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background: rgba(14,16,15,.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index:100;
    display:grid;
    place-items:center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    opacity:0;
    pointer-events:none;
    transition: opacity .18s;
  }
  .modal-backdrop.open{
    opacity:1;
    pointer-events:auto;
  }
  .modal{
    background: var(--surface);
    color: var(--fg);
    border-radius: var(--radius-lg);
    max-width: 480px;
    width:100%;
    max-height: calc(100dvh - 32px);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.4);
    transform: translateY(10px) scale(.98);
    transition: transform .22s cubic-bezier(.2,.7,.3,1);
  }
  .modal-backdrop.open .modal{ transform: translateY(0) scale(1); }

  .modal-head{
    padding: 18px 20px 14px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head .pin{
    width:38px;
    height:38px;
    border-radius:10px;
    background: color-mix(in oklab, var(--plan-color, var(--accent)) 15%, var(--surface));
    color: var(--plan-color, var(--accent));
    display:grid;
    place-items:center;
    flex-shrink:0;
  }
  .modal-head .pin svg{ width:20px; height:20px; }
  .modal-title-wrap{ flex:1; min-width:0; }
  .modal-title-wrap .kicker{
    font-size:11px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--plan-color, var(--accent));
    margin-bottom:3px;
  }
  .modal-title-wrap .mtitle{
    font-family: var(--font-display);
    font-weight:500;
    font-size:22px;
    letter-spacing:-0.015em;
    margin:0;
    line-height:1.15;
  }
  .modal-close{
    appearance:none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg-muted);
    width:30px;
    height:30px;
    border-radius: 8px;
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition: color .15s, border-color .15s;
  }
  .modal-close:hover{ color:var(--fg); border-color: var(--fg-muted); }
  .modal-close svg{ width:14px; height:14px; }

  .modal-body{
    padding: 18px 20px;
    overflow-y:auto;
    flex:1;
    min-width:0;
  }
  .modal-body .desc{
    font-size:14px;
    color:var(--fg-muted);
    margin:0 0 16px;
    text-wrap:pretty;
  }
  .modal-body ul{
    margin:0 0 18px;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .modal-body li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    color: var(--fg);
  }
  .modal-body li::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--plan-color, var(--accent));
    margin-top:7px;
    flex-shrink:0;
  }
  .modal-body .note{
    display:flex;
    align-items:flex-start;
    gap:8px;
    background: color-mix(in oklab, var(--warm) 18%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--warm) 40%, var(--line));
    color: var(--fg);
    padding: 10px 12px;
    border-radius: 10px;
    font-size:13px;
  }
  .modal-body .note svg{
    width:16px; height:16px;
    color: color-mix(in oklab, var(--warm) 60%, var(--fg));
    flex-shrink:0; margin-top:1px;
  }

  .modal-foot{
    padding: 14px 20px 20px;
    border-top: 1px solid var(--line);
    display:grid;
    grid-template-columns: auto 1fr auto;
    gap:12px;
    align-items:center;
    background: var(--surface-sunk);
  }
  .qty{
    display:inline-flex;
    align-items:center;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow:hidden;
  }
  .qty button{
    appearance:none;
    background: transparent;
    color: var(--fg);
    border:0;
    width:34px;
    height:38px;
    font-size:17px;
    cursor:pointer;
    display:grid;
    place-items:center;
  }
  .qty button:hover{ background: var(--surface-sunk); }
  .qty button:disabled{ color: var(--fg-muted); opacity:.5; cursor:not-allowed; }
  .qty input{
    width:40px;
    height:38px;
    border:0;
    background:transparent;
    text-align:center;
    font: 600 14px var(--font-body);
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button,
  .qty input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }

  .modal-price{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 18px;
    letter-spacing:-0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    text-align:right;
  }
  .modal-price small{
    display:block;
    font-family:var(--font-body);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--fg-muted);
    font-weight:500;
  }
  .btn-primary{
    appearance:none;
    border:0;
    background: var(--accent-strong);
    color:#fff;
    font: 600 14px var(--font-body);
    padding: 10px 18px;
    border-radius: 10px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: background .15s, transform .08s;
    white-space:nowrap;
  }
  .btn-primary:hover{ background: var(--accent); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary svg{ width:16px; height:16px; }

  @media (max-width:520px){
    .modal-foot{ grid-template-columns: auto 1fr; grid-auto-rows:auto; }
    .modal-foot .btn-primary{ grid-column: 1 / -1; justify-content:center; }
  }

  /* --- Cart modal specific --- */
  .cart-modal{ max-width: 520px; }
  .cart-empty{
    padding: 36px 20px;
    text-align:center;
    color: var(--fg-muted);
    font-size:14px;
  }
  .cart-empty svg{
    width:40px; height:40px; opacity:.5;
    margin-bottom:10px;
  }
  .cart-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .cart-item{
    display:grid;
    grid-template-columns: auto 1fr auto;
    gap:12px;
    align-items:center;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .cart-item .ci-icon{
    width:36px; height:36px;
    border-radius:9px;
    background: color-mix(in oklab, var(--item-color, var(--accent)) 15%, var(--surface));
    color: var(--item-color, var(--accent));
    display:grid; place-items:center;
    flex-shrink:0;
  }
  .cart-item .ci-icon svg{ width:18px; height:18px; }
  .cart-item .ci-info{ min-width:0; }
  .cart-item .ci-name{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing:-0.01em;
    color:var(--fg);
    margin:0 0 2px;
    line-height:1.1;
  }
  .cart-item .ci-meta{
    font-size:12px;
    color:var(--fg-muted);
    font-variant-numeric: tabular-nums;
  }
  .cart-item .ci-date{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:4px;
    font-size:12px;
    font-weight:500;
    color: var(--item-color, var(--accent));
    padding: 3px 7px;
    border-radius: 6px;
    background: color-mix(in oklab, var(--item-color, var(--accent)) 12%, transparent);
  }
  .cart-item .ci-date svg{ width:12px; height:12px; }
  .cart-item .ci-ctrls{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cart-item .qty-mini{
    display:inline-flex;
    align-items:center;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow:hidden;
  }
  .cart-item .qty-mini button{
    appearance:none; background:transparent; color:var(--fg);
    border:0; width:24px; height:28px; cursor:pointer;
    display:grid; place-items:center; font-size:14px;
  }
  .cart-item .qty-mini button:hover{ background:var(--surface-sunk); }
  .cart-item .qty-mini .n{
    min-width:24px; text-align:center;
    font: 600 12px var(--font-body);
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .cart-remove{
    appearance:none;
    background: transparent;
    border:0;
    color: var(--fg-muted);
    cursor:pointer;
    padding: 4px;
    display:grid;
    place-items:center;
    border-radius: 6px;
    margin-left:2px;
  }
  .cart-remove:hover{ color: var(--familiar); background: color-mix(in oklab, var(--familiar) 10%, transparent); }
  .cart-remove svg{ width:14px; height:14px; }

  .cart-total{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .cart-total .lbl{ font-size:13px; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .cart-total .val{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 24px;
    letter-spacing:-0.015em;
    font-variant-numeric: tabular-nums;
    color:var(--fg);
  }
  .cart-checkout{
    margin-top:14px;
    width:100%;
    justify-content:center;
    padding: 12px 16px;
    font-size:14px;
  }

  /* --- Toast --- */
  .toast{
    position:fixed;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    background: var(--fg);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    display:inline-flex;
    align-items:center;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), opacity .18s;
    z-index: 200;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.4);
    max-width: calc(100% - 32px);
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
  .toast svg{ width:16px; height:16px; color: var(--accent-soft); }

  /* --- Date picker in modal --- */
  .date-field{
    margin: 4px 0 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .date-field label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--fg-muted);
  }
  .date-input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .date-icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color: var(--plan-color, var(--accent));
    pointer-events:none;
  }
  .date-field input[type="date"]{
    width:100%;
    padding: 10px 12px 10px 36px;
    border:1px solid var(--line);
    border-radius:10px;
    background: var(--surface);
    color: var(--fg);
    font: 500 14px var(--font-body);
    font-variant-numeric: tabular-nums;
    appearance:none;
    cursor:pointer;
    transition: border-color .15s;
  }
  .date-field input[type="date"]:hover{ border-color: var(--fg-muted); }
  .date-field input[type="date"]:focus{
    outline:0;
    border-color: var(--plan-color, var(--accent));
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--plan-color, var(--accent)) 20%, transparent);
  }
  .date-field input[type="date"]::-webkit-calendar-picker-indicator{
    cursor:pointer;
    opacity:.5;
  }
  .date-field input[type="date"]::-webkit-calendar-picker-indicator:hover{ opacity:.8; }
  .date-hint{
    font-size:12px;
    color: var(--fg-muted);
    min-height:1em;
  }
  .date-hint.err{ color: var(--familiar); }

  /* --- Views: one per top-nav tab --- */
  .view[hidden]{ display:none !important; }

  /* --- Content sections (Visita / Historia / Contacto) --- */
  .section{
    max-width:1180px;
    margin:0 auto;
    padding-block: 56px 24px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    scroll-margin-top: 90px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .section-head .kicker{
    font-size:11px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    color: var(--accent-strong);
  }
  .section-head h2{
    font-family: var(--font-display);
    font-weight:500;
    font-size: clamp(28px, 3.5vw, 40px);
    letter-spacing:-0.02em;
    margin:0;
    line-height:1.05;
  }
  .section-head p{
    font-size:15px;
    color: var(--fg-muted);
    margin:0;
    max-width: 60ch;
    text-wrap:pretty;
  }
  .section-sub{
    display:grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
    gap: 40px;
    align-items:start;
  }
  @media (max-width: 820px){
    .section-sub{ grid-template-columns: 1fr; gap:24px; }
  }
  .section-sub .lead p{
    font-size:16px;
    line-height:1.6;
    color: var(--fg);
    margin: 0 0 12px;
  }
  .section-sub .lead p + p{ color: var(--fg-muted); font-size:15px; }

  /* Visit photo grid */
  .visit-gallery{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:14px;
  }
  @media (max-width: 520px){
    .visit-gallery{ grid-template-columns: 1fr; }
  }
  .visit-card{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    aspect-ratio: 4/3;
    background: var(--surface-sunk);
    cursor:default;
  }
  .visit-card svg,
  .visit-card img{
    width:100%; height:100%;
    display:block;
    object-fit:cover;
  }
  .visit-card::after{
    content:"";
    position:absolute;
    inset:auto 0 0 0;
    height: 40%;
    background: linear-gradient(to top, rgba(0,0,0,.65), transparent);
    pointer-events:none;
  }
  .visit-card .cap{
    position:absolute;
    left:14px; right:14px; bottom:12px;
    color:#fff;
    font-size: 13px;
    font-weight:600;
    letter-spacing:.01em;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    gap:7px;
    z-index:1;
  }
  .visit-card .cap::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background: var(--accent-soft);
    flex-shrink:0;
  }
  .visit-card.wide{ grid-column: 1 / -1; aspect-ratio: 16/10; }
  .visit-card.tall{ aspect-ratio: 1; grid-row: span 2; }
